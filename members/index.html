<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no"
      name="viewport"
    />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Gothic:wght@400;700;800&amp;display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Nanum+Pen+Script&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./style.css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>MEMBERS</title>
  </head>
  <body>
    <script></script>
    <header class="max-w-7xl mx-auto">
      <a
        href="https://planet.moe/@Callofthewild"
        target="_blank"
        class="w-full h-auto block"
      >
        <img
          src="https://media.planet.moe/accounts/headers/114/435/373/989/450/642/original/b798775a40418238.png"
          alt="Call of the Wild : 2083"
          srcset=""
        />
      </a>
    </header>
    <main class="max-w-7xl mx-auto pt-8 pb-12 px-4 md:px-3">
      <div class="space-y-12">
        <p class="text-xs mb-12 text-gray-200">※데스크탑 사용 권장</p>
        <section class="members"></section>
        <p class="text-xs mb-12 text-gray-200">
          🐶안녕하세요! 개인적인 편의를 위해 만들었으며, 러닝 기간이 종료된
          뒤에는 삭제됩니다!<br />
          캐릭터 이미지를 클릭하면 합격 발표 이미지로,
          <span class="font-bold">이름을 클릭하면 공개 프로필</span>로 링크가
          이동합니다<br /><br />
          누락, 오기입, 수정이 필요하시면 총괄계정 태그와 함께 이파네마 계정으로
          개인 DM 부탁드립니다!
        </p>
      </div>
    </main>
    <script>
      document.addEventListener("DOMContentLoaded", function () {
        /** 등급을 숫자로 변환 (정렬용) */
        function parseGrade(grade) {
          if (grade === "팀장") return 0;
          if (grade === "부팀장") return 1;
          const num = parseInt(grade);
          return isNaN(num) ? 99 : num;
        }

        /** 등급에 따른 클래스 반환 */
        function getGradeClass(grade) {
          switch (grade) {
            case "1":
            case "팀장":
              return ["bg-yellow-400", "text-yellow-900"];
            case "2":
            case "부팀장":
              return ["bg-gray-300", "text-gray-800"];
            case "3":
              return ["bg-amber-700", "text-amber-100"];
            default:
              return [];
          }
        }

        /** 키워드 span 생성 */
        function createKeywordSpans(keywords) {
          return keywords.slice(0, 3).map((kw) => {
            const span = document.createElement("span");
            span.className =
              "rounded-full text-gray-900 px-2 py-1 inline-block";
            span.textContent = kw;
            return span;
          });
        }

        /** 구성원 카드 생성 */
        function createMemberCard(member) {
          const li = document.createElement("li");
          const wrapper = document.createElement("div");
          wrapper.className =
            "flex flex-col items-center bg-gray-50 rounded-xl shadow relative";

          // 포지션
          const position = document.createElement("div");
          position.className = `position ${member.position}`;
          position.textContent = member.position;

          // 등급
          const grade = document.createElement("span");
          grade.classList.add(
            "grade",
            "px-2",
            "py-1",
            "text-xs",
            "font-bold",
            "rounded-full",
            "shadow-lg"
          );
          getGradeClass(member.grade).forEach((cls) =>
            grade.classList.add(cls)
          );
          grade.textContent =
            member.grade === "팀장" || member.grade === "부팀장"
              ? member.grade
              : `${member.grade}급`;

          // 이미지
          const aImg = document.createElement("a");
          aImg.href = member.imgLink;
          aImg.target = "_blank";
          aImg.className = "img_area mb-2 rounded-full border border-gray-200";

          const img = document.createElement("img");
          img.alt = member.name;
          img.className = "w-full h-full object-cover img_target";
          img.setAttribute("data-src", member.originImg);
          img.src = member.loadingImg;
          aImg.appendChild(img);

          // 정보
          const info = document.createElement("div");
          info.className = "info_area";

          const nameLink = document.createElement("a");
          nameLink.href = member.profileLink;
          nameLink.target = "_blank";
          nameLink.className = "name font-semibold text-lg sm:text-base";
          nameLink.textContent = member.name;

          const pKeywords = document.createElement("p");
          pKeywords.className = "keywords text-xs text-gray-400";
          createKeywordSpans(member.keywords).forEach((span) =>
            pKeywords.appendChild(span)
          );

          info.appendChild(nameLink);
          info.appendChild(pKeywords);

          // 밑줄
          const underline = document.createElement("div");
          underline.className = "underline";

          // 조립
          wrapper.appendChild(position);
          wrapper.appendChild(grade);
          wrapper.appendChild(aImg);
          wrapper.appendChild(info);
          wrapper.appendChild(underline);
          li.appendChild(wrapper);

          return li;
        }

        /** 팀 article 생성 */
        function createTeamArticle(team) {
          const article = document.createElement("article");

          // 타이틀 영역
          const teamTitleDiv = document.createElement("div");
          teamTitleDiv.className = "team-title";

          const divider = document.createElement("span");
          divider.className = "divider";

          const title = document.createElement("span");
          title.className = "noto-sans-300";
          title.textContent = team.teamTitle;

          teamTitleDiv.appendChild(divider);
          teamTitleDiv.appendChild(title);

          // 리스트 영역
          const ul = document.createElement("ul");
          ul.className = "team-list grid gap-3 mb-8";

          team.members.forEach((member) => {
            const card = createMemberCard(member);
            ul.appendChild(card);
          });

          article.appendChild(teamTitleDiv);
          article.appendChild(ul);
          return article;
        }

        /** 이미지 lazy loading */
        function lazyLoadImages() {
          document.querySelectorAll("img[data-src]").forEach((img) => {
            const realSrc = img.getAttribute("data-src");
            if (!realSrc) return;
            const tempImg = new window.Image();
            tempImg.onload = function () {
              img.src = realSrc;
            };
            tempImg.src = realSrc;
          });
        }

        /** 반짝이 효과 부여 */
        function addTwinkleEffect() {
          const targetGrades = ["팀장", "부팀장", "1"];
          document.querySelectorAll(".team-list li").forEach((item) => {
            const gradeEl = item.querySelector(".grade");
            if (gradeEl && targetGrades.includes(gradeEl.textContent.trim())) {
              const imgEl = item.querySelector("img.img_target");
              if (imgEl) {
                const twinkleWrapper = document.createElement("div");
                twinkleWrapper.className = "twinkle_wrapper";
                const twinkle = document.createElement("div");
                twinkle.className = "twinkle";
                twinkleWrapper.appendChild(twinkle);
                imgEl.insertAdjacentElement("afterend", twinkleWrapper);
              }
            }
          });
        }

        /** 데이터 로딩 및 삽입 */
        fetch("data.json")
          .then((res) => res.json())
          .then((data) => {
            const container = document.querySelector("section.members");

            data.forEach((team) => {
              // 등급 → 이름 순 정렬
              team.members.sort((a, b) => {
                const gradeA = parseGrade(a.grade);
                const gradeB = parseGrade(b.grade);
                if (gradeA !== gradeB) return gradeA - gradeB;
                return a.name.localeCompare(b.name, "ko");
              });

              const article = createTeamArticle(team);
              container.appendChild(article);
            });

            lazyLoadImages();
            addTwinkleEffect();
          });
      });
    </script>
  </body>
</html>
